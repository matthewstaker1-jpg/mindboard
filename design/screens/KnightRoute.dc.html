<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Write the move</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>body{margin:0}a{color:#C6F432}a:hover{color:#E2FF7A}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F12; color: #ECEDEF; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 18px 16px 8px; display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Back to journey" style="width: 44px; height: 44px; border-radius: 12px; background: #17191E; display: flex; align-items: center; justify-content: center; color: #ECEDEF">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font: 500 11px 'JetBrains Mono', monospace; color: #9AA0AB"><span>STAGE 2 · LEVEL 6</span><span>3 / 15</span></div>
      <div style="height: 6px; border-radius: 3px; background: #2A2E37; overflow: hidden"><div style="width: 20%; height: 6px; background: #C6F432; border-radius: 3px"></div></div>
    </div>
  </div>

  <div style="padding: 12px 20px 14px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 26px; font-weight: 600">Write the move</div>
    <div style="font-size: 14px; color: #9AA0AB">The knight goes from the green square to the lime one.</div>
  </div>

  <div style="display: flex; justify-content: center">
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); width: 344px; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.55)">
      <sc-for list="{{sq}}" as="s" hint-placeholder-count="64">
        <div style="position: relative; height: {{s.sz}}px; background: {{s.bg}}; display: flex; align-items: center; justify-content: center">
          <span style="font-size: {{s.fs}}px; line-height: 1; color: {{s.pc}}; text-shadow: {{s.sh}}; font-weight: 700; font-family: 'Segoe UI Symbol', 'Noto Sans Symbols 2', 'DejaVu Sans', 'JetBrains Mono', serif">{{s.glyph}}</span>
          <div style="position: absolute; width: {{s.gs}}px; height: {{s.gs}}px; border-radius: 50%; border: {{s.ring}}; box-sizing: border-box"></div>
          <span style="position: absolute; left: 3px; top: 2px; font: 700 9px 'JetBrains Mono', monospace; color: {{s.lc}}">{{s.rl}}</span>
          <span style="position: absolute; right: 3px; bottom: 1px; font: 700 9px 'JetBrains Mono', monospace; color: {{s.lc}}">{{s.fl}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="margin: 16px 20px 0; height: 58px; border-radius: 16px; background: #17191E; border: 1px solid #2A2E37; display: flex; align-items: center; justify-content: center; gap: 4px; font: 700 30px 'JetBrains Mono', monospace">
    <span>N</span><span>f</span><span style="width: 20px; height: 4px; background: #C6F432; border-radius: 2px; margin-top: 20px"></span>
  </div>

  <div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 6px">
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{pieces}}" as="k" hint-placeholder-count="6">
        <button type="button" aria-label="{{k.aria}}" style="height: 44px; border-radius: 11px; border: 1px solid #2A2E37; background: #1F2229; color: #ECEDEF; font: 700 17px 'JetBrains Mono', monospace">{{k.label}}</button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{files}}" as="k" hint-placeholder-count="8">
        <button type="button" style="height: 44px; border-radius: 11px; border: 1px solid #2A2E37; background: #17191E; color: #ECEDEF; font: 700 17px 'JetBrains Mono', monospace">{{k.label}}</button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{ranks}}" as="k" hint-placeholder-count="8">
        <button type="button" style="height: 44px; border-radius: 11px; border: 1px solid #2A2E37; background: #17191E; color: #ECEDEF; font: 700 17px 'JetBrains Mono', monospace">{{k.label}}</button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <button type="button" style="height: 44px; border-radius: 11px; border: 1px solid #2A2E37; background: #17191E; color: #ECEDEF; font: 700 15px 'JetBrains Mono', monospace">O-O</button>
      <button type="button" style="height: 44px; border-radius: 11px; border: 1px solid #2A2E37; background: #17191E; color: #ECEDEF; font: 700 15px 'JetBrains Mono', monospace">+</button>
      <button type="button" aria-label="Delete" style="height: 44px; border-radius: 11px; border: 1px solid #2A2E37; background: #17191E; color: #ECEDEF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"></path><path d="M17 9l-5 6M12 9l5 6"></path></svg>
      </button>
      <button type="button" style="height: 44px; border-radius: 11px; border: 0; background: #C6F432; color: #0E0F12; font: 700 15px 'Space Grotesk', sans-serif">Check</button>
    </div>
  </div>

  <div style="margin: auto 20px 20px; font-size: 13px; color: #9AA0AB; line-height: 1.4">Next up: get the knight from <span style="font-family: 'JetBrains Mono', monospace; color: #ECEDEF">b1</span> to <span style="font-family: 'JetBrains Mono', monospace; color: #ECEDEF">e4</span> in two hops — name the square in between.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  buildBoard(o) {
    var G = { K: '♚', Q: '♛', R: '♜', B: '♝', N: '♞', P: '♟' };
    var F = 'abcdefgh'; var pos = {}; var rows = o.fen.split('/');
    for (var r = 0; r < 8; r++) { var c = 0; var row = rows[r]; for (var k = 0; k < row.length; k++) { var ch = row[k]; if (ch >= '1' && ch <= '8') { c += parseInt(ch, 10); } else { pos[F[c] + (8 - r)] = ch; c++; } } }
    var sz = o.size || 43; var out = [];
    for (var i = 0; i < 8; i++) { for (var j = 0; j < 8; j++) {
      var f = o.flip ? 7 - j : j; var rk = o.flip ? i + 1 : 8 - i; var sq = F[f] + rk; var light = (f + rk) % 2 === 1;
      var p = pos[sq]; var hm = (o.hide && p) ? o.hide(p, sq) : '';
      var bg = light ? '#8E97A8' : '#59627A';
      var h = o.hl ? o.hl[sq] : null;
      if (h === 'a') { bg = light ? '#D4F55A' : '#B5DB2E'; }
      if (h === 'f') { bg = light ? '#A9B57A' : '#7F8B55'; }
      if (h === 'w') { bg = light ? '#FFC56E' : '#F0A43C'; }
      if (h === 'e') { bg = light ? '#FF8C7E' : '#E86A5B'; }
      var mk = o.marks ? o.marks[sq] : null;
      var glyph = ''; var pc = '#FBFAF6'; var sh = 'none';
      if (mk) { glyph = mk; pc = '#0E0F12'; }
      else if (p && hm !== 'ghost' && hm !== 'gone') { var w = p === p.toUpperCase(); glyph = G[p.toUpperCase()] + '︎'; pc = w ? '#FBFAF6' : '#121318'; sh = w ? '0 0 1px #121318, 0 1px 2px rgba(0,0,0,0.6)' : '0 0 1px rgba(255,255,255,0.5)'; }
      var lab = o.labels !== false;
      out.push({ k: sq, bg: bg, glyph: glyph, pc: pc, sh: sh, sz: sz, fs: Math.round(sz * (mk ? 0.5 : 0.8)), gs: Math.round(sz * 0.56),
        ring: hm === 'ghost' ? '2px dashed rgba(251,250,246,0.75)' : '0px solid transparent',
        rl: (lab && j === 0) ? String(rk) : '', fl: (lab && i === 7) ? F[f] : '', lc: light ? '#1E222B' : '#F2F4F7' });
    } }
    return out;
  }
  renderVals() {
    var pieces = [['K', 'King'], ['Q', 'Queen'], ['R', 'Rook'], ['B', 'Bishop'], ['N', 'Knight'], ['x', 'Captures']].map(function (p) { return { label: p[0], aria: p[1] }; });
    var files = 'abcdefgh'.split('').map(function (l) { return { label: l }; });
    var ranks = '12345678'.split('').map(function (l) { return { label: l }; });
    return { sq: this.buildBoard({ fen: 'rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR', hl: { g1: 'f', f3: 'a' } }), pieces: pieces, files: files, ranks: ranks };
  }
}
</script>
</body>
</html>

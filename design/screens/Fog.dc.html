<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fog — pieces fade</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>body{margin:0}a{color:#C6F432}a:hover{color:#E2FF7A}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F12; color: #ECEDEF; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 18px 16px 6px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Back to journey" style="width: 44px; height: 44px; border-radius: 12px; background: #17191E; display: flex; align-items: center; justify-content: center; color: #ECEDEF">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="font: 500 11px 'JetBrains Mono', monospace; letter-spacing: 0.12em; color: #9AA0AB">STAGE 3 · FOG · LV 14</div>
    <button type="button" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #17191E; color: #ECEDEF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
    </button>
  </div>

  <div style="padding: 8px 23px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 32px; height: 32px; border-radius: 10px; background: #1F2229; display: flex; align-items: center; justify-content: center; font: 700 12px 'JetBrains Mono', monospace; color: #9AA0AB">SF</div>
      <div style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 14px">Engine</span><span style="font: 500 11px 'JetBrains Mono', monospace; color: #9AA0AB">≈1400</span></div>
    </div>
    <div style="padding: 6px 10px; border-radius: 8px; background: #17191E; font: 700 15px 'JetBrains Mono', monospace; color: #9AA0AB">9:12</div>
  </div>

  <div style="display: flex; justify-content: center">
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); width: 344px; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.55)">
      <sc-for list="{{sq}}" as="s" hint-placeholder-count="64">
        <div style="position: relative; height: {{s.sz}}px; background: {{s.bg}}; display: flex; align-items: center; justify-content: center">
          <span style="font-size: {{s.fs}}px; line-height: 1; color: {{s.pc}}; text-shadow: {{s.sh}}; font-weight: 700; font-family: 'Segoe UI Symbol', 'Noto Sans Symbols 2', 'DejaVu Sans', 'JetBrains Mono', serif">{{s.glyph}}</span>
          <div style="position: absolute; width: {{s.gs}}px; height: {{s.gs}}px; border-radius: 50%; border: {{s.ring}}; box-sizing: border-box"></div>
          <span style="position: absolute; left: 3px; top: 2px; font: 700 9px 'JetBrains Mono', monospace; color: {{s.lc}}">{{s.rl}}</span>
          <span style="position: absolute; right: 3px; bottom: 1px; font: 700 9px 'JetBrains Mono', monospace; color: {{s.lc}}">{{s.fl}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 8px 23px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 32px; height: 32px; border-radius: 10px; background: #C6F432; display: flex; align-items: center; justify-content: center; font: 700 12px 'JetBrains Mono', monospace; color: #0E0F12">MS</div>
      <div style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 14px">You · White</span><span style="font: 500 11px 'JetBrains Mono', monospace; color: #9AA0AB">4 pieces in fog</span></div>
    </div>
    <div style="padding: 6px 10px; border-radius: 8px; background: #ECEDEF; font: 700 15px 'JetBrains Mono', monospace; color: #0E0F12">8:47</div>
  </div>

  <div style="margin: 4px 16px 0; padding: 10px 12px; border-radius: 12px; background: #121418; border: 1px solid #2A2E37; font: 500 13px 'JetBrains Mono', monospace; color: #9AA0AB; white-space: nowrap; overflow: hidden">
    1.e4 e5 2.Nf3 Nc6 3.Bc4 Bc5 4.c3 <span style="color: #ECEDEF; background: #2A2E37; padding: 2px 5px; border-radius: 5px">Nf6</span>
  </div>

  <div style="margin: 12px 16px 0; padding: 14px; border-radius: 16px; background: #17191E; border: 1px solid #2A2E37; display: flex; align-items: center; gap: 12px">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA0AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h18M5 19h14M7 11h10"></path><path d="M8 7a4 4 0 0 1 8 0"></path></svg>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 13px"><span>Fog density</span><span style="font-family: 'JetBrains Mono', monospace; color: #C6F432">4 / 16</span></div>
      <div style="height: 6px; border-radius: 3px; background: #2A2E37"><div style="width: 25%; height: 6px; border-radius: 3px; background: #C6F432"></div></div>
    </div>
  </div>

  <div style="margin: auto 16px 20px; display: flex; gap: 8px">
    <button type="button" style="height: 56px; padding: 0 14px; border-radius: 16px; border: 1px solid #2A2E37; background: #17191E; color: #ECEDEF; display: flex; align-items: center; gap: 8px; font: 600 14px 'Space Grotesk', sans-serif">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      Peek · 3
    </button>
    <label style="flex: 1; height: 56px; border-radius: 16px; background: #17191E; border: 1px solid #C6F432; display: flex; align-items: center; padding: 0 14px; gap: 8px">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Your move</span>
      <input type="text" value="O-O" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #ECEDEF; font: 700 20px 'JetBrains Mono', monospace; outline: none">
    </label>
    <button type="button" aria-label="Speak your move" style="width: 56px; height: 56px; border-radius: 16px; border: 0; background: #C6F432; color: #0E0F12; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  buildBoard(o) {
    var G = { K: '♚', Q: '♛', R: '♜', B: '♝', N: '♞', P: '♟' };
    var F = 'abcdefgh'; var pos = {}; var rows = o.fen.split('/');
    for (var r = 0; r < 8; r++) { var c = 0; var row = rows[r]; for (var k = 0; k < row.length; k++) { var ch = row[k]; if (ch >= '1' && ch <= '8') { c += parseInt(ch, 10); } else { pos[F[c] + (8 - r)] = ch; c++; } } }
    var sz = o.size || 43; var out = [];
    for (var i = 0; i < 8; i++) { for (var j = 0; j < 8; j++) {
      var f = o.flip ? 7 - j : j; var rk = o.flip ? i + 1 : 8 - i; var sq = F[f] + rk; var light = (f + rk) % 2 === 1;
      var p = pos[sq]; var hm = (o.hide && p) ? o.hide(p, sq) : '';
      var bg = light ? '#8E97A8' : '#59627A';
      var h = o.hl ? o.hl[sq] : null;
      if (h === 'a') { bg = light ? '#D4F55A' : '#B5DB2E'; }
      if (h === 'f') { bg = light ? '#A9B57A' : '#7F8B55'; }
      if (h === 'w') { bg = light ? '#FFC56E' : '#F0A43C'; }
      if (h === 'e') { bg = light ? '#FF8C7E' : '#E86A5B'; }
      var mk = o.marks ? o.marks[sq] : null;
      var glyph = ''; var pc = '#FBFAF6'; var sh = 'none';
      if (mk) { glyph = mk; pc = '#0E0F12'; }
      else if (p && hm !== 'ghost' && hm !== 'gone') { var w = p === p.toUpperCase(); glyph = G[p.toUpperCase()] + '︎'; pc = w ? '#FBFAF6' : '#121318'; sh = w ? '0 0 1px #121318, 0 1px 2px rgba(0,0,0,0.6)' : '0 0 1px rgba(255,255,255,0.5)'; }
      var lab = o.labels !== false;
      out.push({ k: sq, bg: bg, glyph: glyph, pc: pc, sh: sh, sz: sz, fs: Math.round(sz * (mk ? 0.5 : 0.8)), gs: Math.round(sz * 0.56),
        ring: hm === 'ghost' ? '2px dashed rgba(251,250,246,0.75)' : '0px solid transparent',
        rl: (lab && j === 0) ? String(rk) : '', fl: (lab && i === 7) ? F[f] : '', lc: light ? '#1E222B' : '#F2F4F7' });
    } }
    return out;
  }
  renderVals() {
    var fogged = { c4: 1, f3: 1, d1: 1, a1: 1 };
    return { sq: this.buildBoard({ fen: 'r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/2P2N2/PP1P1PPP/RNBQK2R', hl: { g8: 'f', f6: 'f' }, hide: function (p, s) { return fogged[s] ? 'ghost' : ''; } }) };
  }
}
</script>
</body>
</html>

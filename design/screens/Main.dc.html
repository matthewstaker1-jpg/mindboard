<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journey home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>body{margin:0}a{color:#C6F432}a:hover{color:#E2FF7A}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F12; color: #ECEDEF; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 20px 20px 10px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 30px; height: 30px; border-radius: 9px; background: #C6F432; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E0F12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7c2 0 3.7.6 5.1 1.5M22 12s-3.5 7-10 7c-2 0-3.7-.6-5.1-1.5"></path><path d="M3 3l18 18"></path></svg>
      </div>
      <span style="font: 700 14px 'JetBrains Mono', monospace; letter-spacing: 0.2em">MINDBOARD</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #17191E; border: 1px solid #2A2E37; font: 700 13px 'JetBrains Mono', monospace; color: #FFB547">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-2.7 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-2 2-5 5-5 8 0 4.3 3 7 7 7z"></path></svg>
      12 days
    </div>
  </div>

  <div style="margin: 6px 16px 0; padding: 18px; border-radius: 22px; background: #17191E; border: 1px solid #2A2E37; display: flex; flex-direction: column; gap: 12px">
    <div style="font: 500 11px 'JetBrains Mono', monospace; letter-spacing: 0.14em; color: #9AA0AB">STAGE 3 · FADE THE BOARD</div>
    <div style="font-size: 28px; font-weight: 600; line-height: 1.05">Fog · Level 14</div>
    <div style="font-size: 14px; color: #9AA0AB; line-height: 1.4">Four of your pieces vanish each game. Keep them in your head.</div>
    <div style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="16">
        <div style="height: 10px; border-radius: 3px; background: {{c.bg}}"></div>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font: 500 11px 'JetBrains Mono', monospace; color: #9AA0AB"><span>BOARD VISIBLE</span><span style="color: #ECEDEF">62%</span></div>
    <a href="Fog.dc.html" style="margin-top: 4px; height: 50px; border-radius: 14px; background: #C6F432; color: #0E0F12; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 16px">
      Continue playing
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E0F12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </div>

  <div style="padding: 18px 20px 6px; display: flex; justify-content: space-between; align-items: baseline">
    <span style="font-size: 17px; font-weight: 600">Your path</span>
    <span style="font: 500 11px 'JetBrains Mono', monospace; color: #9AA0AB">4 / 10 STAGES</span>
  </div>

  <div style="flex: 1; padding: 0 20px; display: flex; flex-direction: column">
    <sc-for list="{{stages}}" as="s" hint-placeholder-count="10">
      <div style="height: 37px; display: flex; align-items: center; gap: 14px">
        <div style="width: 24px; height: 24px; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{s.nodeBg}}; border: {{s.nodeBorder}}">
          <sc-if value="{{s.done}}" hint-placeholder-val="{{true}}">
            <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0E0F12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>
          </sc-if>
          <sc-if value="{{s.cur}}" hint-placeholder-val="{{false}}">
            <div style="width: 8px; height: 8px; border-radius: 50%; background: #C6F432"></div>
          </sc-if>
        </div>
        <span style="flex: 1; font-size: 15px; color: {{s.color}}; font-weight: {{s.weight}}">{{s.name}}</span>
        <span style="font: 500 11px 'JetBrains Mono', monospace; color: {{s.metaColor}}">{{s.meta}}</span>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Main" style="height: 74px; border-top: 1px solid #2A2E37; background: #121418; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #C6F432; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="5" r="2"></circle><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"></path></svg>
      Journey
    </a>
    <a href="SquareQuiz.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA0AB; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>
      Drills
    </a>
    <a href="Voice.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA0AB; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"></path><rect x="3" y="14" width="4" height="7" rx="1.5"></rect><rect x="17" y="14" width="4" height="7" rx="1.5"></rect></svg>
      Blind play
    </a>
    <a href="Review.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA0AB; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
      Progress
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var cells = [];
    for (var i = 0; i < 16; i++) { cells.push({ bg: i < 10 ? '#C6F432' : '#2A2E37' }); }
    var raw = [
      ['Name the square', 'done', '20/20'],
      ['Find the square', 'done', '20/20'],
      ['Both sides of the board', 'done', '20/20'],
      ['Moves & notation', 'done', '20/20'],
      ['Fog · pieces fade', 'cur', '14/20'],
      ['Pawnless', 'lock', ''],
      ['Ghost army', 'lock', ''],
      ['Dark board', 'lock', ''],
      ['Full blindfold', 'lock', ''],
      ['Headphones mode', 'lock', 'GOAL']
    ];
    var stages = raw.map(function (r) {
      var st = r[1];
      return {
        name: r[0], meta: r[2],
        done: st === 'done', cur: st === 'cur',
        nodeBg: st === 'done' ? '#C6F432' : 'transparent',
        nodeBorder: st === 'done' ? '0px solid transparent' : (st === 'cur' ? '2px solid #C6F432' : '2px solid #3A3F4A'),
        color: st === 'lock' ? '#8A909B' : '#ECEDEF',
        weight: st === 'cur' ? '700' : '500',
        metaColor: st === 'cur' ? '#C6F432' : (r[2] === 'GOAL' ? '#FFB547' : '#8A909B')
      };
    });
    return { cells: cells, stages: stages };
  }
}
</script>
</body>
</html>

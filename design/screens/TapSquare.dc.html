<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Find the square as Black</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>body{margin:0}a{color:#C6F432}a:hover{color:#E2FF7A}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F12; color: #ECEDEF; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 18px 16px 8px; display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Back to journey" style="width: 44px; height: 44px; border-radius: 12px; background: #17191E; display: flex; align-items: center; justify-content: center; color: #ECEDEF">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font: 500 11px 'JetBrains Mono', monospace; color: #9AA0AB"><span>STAGE 1 · LEVEL 5</span><span>12 / 20</span></div>
      <div style="height: 6px; border-radius: 3px; background: #2A2E37; overflow: hidden"><div style="width: 60%; height: 6px; background: #C6F432; border-radius: 3px"></div></div>
    </div>
    <div style="padding: 6px 10px; border-radius: 999px; background: #121318; border: 1px solid #3A3F4A; font: 700 11px 'JetBrains Mono', monospace; display: flex; align-items: center; gap: 6px">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: #121318; border: 1.5px solid #ECEDEF"></span>BLACK
    </div>
  </div>

  <div style="padding: 12px 20px 14px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 26px; font-weight: 600">Tap <span style="font-family: 'JetBrains Mono', monospace; color: #C6F432">g3</span></div>
    <div style="font-size: 14px; color: #9AA0AB">Black's view · labels off · 2.0s target</div>
  </div>

  <div style="display: flex; justify-content: center">
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); width: 344px; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.55)">
      <sc-for list="{{sq}}" as="s" hint-placeholder-count="64">
        <div style="position: relative; height: {{s.sz}}px; background: {{s.bg}}; display: flex; align-items: center; justify-content: center">
          <span style="font-size: {{s.fs}}px; line-height: 1; color: {{s.pc}}; text-shadow: {{s.sh}}; font-weight: 700; font-family: 'Segoe UI Symbol', 'Noto Sans Symbols 2', 'DejaVu Sans', 'JetBrains Mono', serif">{{s.glyph}}</span>
          <div style="position: absolute; width: {{s.gs}}px; height: {{s.gs}}px; border-radius: 50%; border: {{s.ring}}; box-sizing: border-box"></div>
          <span style="position: absolute; left: 3px; top: 2px; font: 700 9px 'JetBrains Mono', monospace; color: {{s.lc}}">{{s.rl}}</span>
          <span style="position: absolute; right: 3px; bottom: 1px; font: 700 9px 'JetBrains Mono', monospace; color: {{s.lc}}">{{s.fl}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="margin: 20px 20px 0; padding: 16px; border-radius: 18px; background: #1E1A12; border: 1px solid #5A4520; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 700; color: #FFB547; font-size: 15px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
      You tapped <span style="font-family: 'JetBrains Mono', monospace">b6</span>
    </div>
    <div style="font-size: 14px; line-height: 1.45; color: #D9DCE2">That's g3 seen from White's side. From Black's chair the files run <span style="font-family: 'JetBrains Mono', monospace; color: #ECEDEF">h → a</span>, left to right, and rank 1 is at the top.</div>
  </div>

  <div style="margin: 14px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="padding: 12px; border-radius: 14px; background: #17191E; display: flex; flex-direction: column; gap: 2px"><span style="font: 700 18px 'JetBrains Mono', monospace">11/12</span><span style="font-size: 12px; color: #9AA0AB">correct</span></div>
    <div style="padding: 12px; border-radius: 14px; background: #17191E; display: flex; flex-direction: column; gap: 2px"><span style="font: 700 18px 'JetBrains Mono', monospace">1.4s</span><span style="font-size: 12px; color: #9AA0AB">avg time</span></div>
    <div style="padding: 12px; border-radius: 14px; background: #17191E; display: flex; flex-direction: column; gap: 2px"><span style="font: 700 18px 'JetBrains Mono', monospace; color: #FFB547">g3</span><span style="font-size: 12px; color: #9AA0AB">re-queued</span></div>
  </div>

  <div style="margin: auto 20px 22px">
    <button type="button" style="width: 100%; height: 52px; border-radius: 14px; border: 0; background: #C6F432; color: #0E0F12; font: 700 16px 'Space Grotesk', sans-serif">Next square</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  buildBoard(o) {
    var G = { K: '♚', Q: '♛', R: '♜', B: '♝', N: '♞', P: '♟' };
    var F = 'abcdefgh'; var pos = {}; var rows = o.fen.split('/');
    for (var r = 0; r < 8; r++) { var c = 0; var row = rows[r]; for (var k = 0; k < row.length; k++) { var ch = row[k]; if (ch >= '1' && ch <= '8') { c += parseInt(ch, 10); } else { pos[F[c] + (8 - r)] = ch; c++; } } }
    var sz = o.size || 43; var out = [];
    for (var i = 0; i < 8; i++) { for (var j = 0; j < 8; j++) {
      var f = o.flip ? 7 - j : j; var rk = o.flip ? i + 1 : 8 - i; var sq = F[f] + rk; var light = (f + rk) % 2 === 1;
      var p = pos[sq]; var hm = (o.hide && p) ? o.hide(p, sq) : '';
      var bg = light ? '#8E97A8' : '#59627A';
      var h = o.hl ? o.hl[sq] : null;
      if (h === 'a') { bg = light ? '#D4F55A' : '#B5DB2E'; }
      if (h === 'f') { bg = light ? '#A9B57A' : '#7F8B55'; }
      if (h === 'w') { bg = light ? '#FFC56E' : '#F0A43C'; }
      if (h === 'e') { bg = light ? '#FF8C7E' : '#E86A5B'; }
      var mk = o.marks ? o.marks[sq] : null;
      var glyph = ''; var pc = '#FBFAF6'; var sh = 'none';
      if (mk) { glyph = mk; pc = '#0E0F12'; }
      else if (p && hm !== 'ghost' && hm !== 'gone') { var w = p === p.toUpperCase(); glyph = G[p.toUpperCase()] + '︎'; pc = w ? '#FBFAF6' : '#121318'; sh = w ? '0 0 1px #121318, 0 1px 2px rgba(0,0,0,0.6)' : '0 0 1px rgba(255,255,255,0.5)'; }
      var lab = o.labels !== false;
      out.push({ k: sq, bg: bg, glyph: glyph, pc: pc, sh: sh, sz: sz, fs: Math.round(sz * (mk ? 0.5 : 0.8)), gs: Math.round(sz * 0.56),
        ring: hm === 'ghost' ? '2px dashed rgba(251,250,246,0.75)' : '0px solid transparent',
        rl: (lab && j === 0) ? String(rk) : '', fl: (lab && i === 7) ? F[f] : '', lc: light ? '#1E222B' : '#F2F4F7' });
    } }
    return out;
  }
  renderVals() {
    return { sq: this.buildBoard({ fen: '8/8/8/8/8/8/8/8', flip: true, labels: false, hl: { b6: 'w', g3: 'a' }, marks: { b6: '×', g3: 'g3' } }) };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build roadmap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>body{margin:0}a{color:#C6F432}a:hover{color:#E2FF7A}</style>
</helmet>
<div style="width: 1440px; height: 960px; box-sizing: border-box; background: #0E0F12; color: #ECEDEF; font-family: 'Space Grotesk', system-ui, sans-serif; padding: 56px 64px; display: flex; flex-direction: column; gap: 32px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font: 700 12px 'JetBrains Mono', monospace; letter-spacing: 0.16em; color: #C6F432">BUILD ORDER FOR CLAUDE CODE</span>
      <span style="font-size: 44px; font-weight: 700; letter-spacing: -0.01em">From "what square is this?" to eyes-closed voice chess</span>
    </div>
    <span style="font: 500 13px 'JetBrains Mono', monospace; color: #9AA0AB">Each phase is playable on its own</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; flex: 1">
    <sc-for list="{{phases}}" as="p" hint-placeholder-count="6">
      <div style="padding: 20px; border-radius: 20px; background: {{p.bg}}; border: 1px solid {{p.border}}; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font: 700 28px 'JetBrains Mono', monospace; color: {{p.numColor}}">{{p.n}}</span>
          <span style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: 0.12em; color: #9AA0AB">{{p.tag}}</span>
        </div>
        <span style="font-size: 21px; font-weight: 700; line-height: 1.15">{{p.name}}</span>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: 0.12em; color: #9AA0AB">SHIPS</span>
          <span style="font-size: 14px; line-height: 1.45; color: #D9DCE2">{{p.ships}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: 0.12em; color: #9AA0AB">TECH</span>
          <span style="font: 500 12px 'JetBrains Mono', monospace; line-height: 1.55; color: #C6F432">{{p.tech}}</span>
        </div>
        <div style="margin-top: auto; padding-top: 12px; border-top: 1px solid #2A2E37; display: flex; flex-direction: column; gap: 4px">
          <span style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: 0.12em; color: #9AA0AB">DONE WHEN</span>
          <span style="font-size: 13px; line-height: 1.45">{{p.done}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font: 700 11px 'JetBrains Mono', monospace; letter-spacing: 0.14em; color: #9AA0AB">THE LADDER · HOW MUCH OF THE BOARD YOU SEE</span>
    <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{ladder}}" as="l" hint-placeholder-count="10">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="height: 10px; border-radius: 4px; background: #2A2E37; overflow: hidden"><div style="height: 10px; width: {{l.w}}%; background: {{l.c}}"></div></div>
          <span style="font-size: 12px; font-weight: 600">{{l.name}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    var raw = [
      ['00', 'FOUNDATION', 'Board engine', 'A reusable board that can flip, hide any piece, light any square and drop labels. Progress saved on device.', 'React + TypeScript + Vite (PWA) · chess.js · IndexedDB', 'Any position renders from either side with any mix of pieces hidden.'],
      ['01', 'MVP', 'Notation trainer', 'Stage 1–2 drills: name the square, tap the square, write the move, read the move. Streaks, timers, weak-square re-queue.', 'Per-square accuracy + speed stats · spaced repetition queue · opening move bank', 'You can climb 10 levels and the app knows your worst squares.'],
      ['02', 'CORE', 'Fade the board', 'Full games vs an engine as the board disappears level by level. Recall checks, limited peeks, typed move entry.', 'Stockfish (WASM, web worker) at set strength · SAN parser with forgiving input', 'You can finish a game vs the engine with zero pieces shown.'],
      ['03', 'GOAL', 'Headphones mode', 'Speak a move, hear it read back, short cancel window, then it plays. Voice commands: repeat, where is…, take back.', 'Speech-to-text → match only against legal moves · text-to-speech read-back · media-key controls', '20 spoken moves in a row recognised hands-free, screen off.'],
      ['04', 'COACH', 'Blunder guard', 'Engine checks every move. A big eval drop triggers "did you mean that?", likely intended moves and a slip log.', 'Eval before vs after · centipawn threshold · "was this legal if a piece were still on its old square?"', 'Fires on hung pieces, stays quiet on normal moves.'],
      ['05', 'LATER', 'Ship it', 'Post-game reveal and slip drills, accounts and sync, rated voice ladder, app store builds.', 'Capacitor or Expo wrapper for native speech + background audio', 'On your phone, playing a game on a walk.']
    ];
    var phases = raw.map(function (r, i) {
      var goal = r[1] === 'GOAL';
      return { n: r[0], tag: r[1], name: r[2], ships: r[3], tech: r[4], done: r[5],
        bg: goal ? '#1A2010' : '#17191E', border: goal ? '#4B5E17' : '#2A2E37', numColor: goal ? '#C6F432' : '#ECEDEF' };
    });
    var lr = [['Squares', 100], ['Both sides', 100], ['Notation', 100], ['Fog', 75], ['Pawnless', 60], ['Ghost army', 50], ['Dark board', 8], ['No board', 0], ['Full blind', 0], ['Voice', 0]];
    var ladder = lr.map(function (l, i) { return { name: l[0], w: Math.max(l[1], 3), c: i < 3 ? '#9AA0AB' : (i < 7 ? '#C6F432' : '#FFB547') }; });
    return { phases: phases, ladder: ladder };
  }
}
</script>
</body>
</html>

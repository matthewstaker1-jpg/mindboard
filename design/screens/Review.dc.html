<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post-game reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>body{margin:0}a{color:#C6F432}a:hover{color:#E2FF7A}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F12; color: #ECEDEF; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 4px">
    <span style="font: 700 11px 'JetBrains Mono', monospace; letter-spacing: 0.14em; color: #C6F432">BLINDFOLD OFF</span>
    <span style="font-size: 28px; font-weight: 700">You drew the engine.</span>
    <span style="font-size: 14px; color: #9AA0AB">41 moves, eyes closed the whole way.</span>
  </div>

  <div style="padding: 16px 20px 0; display: flex; gap: 14px; align-items: stretch">
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); width: 176px; border-radius: 10px; overflow: hidden; flex-shrink: 0">
      <sc-for list="{{sq}}" as="s" hint-placeholder-count="64">
        <div style="height: {{s.sz}}px; background: {{s.bg}}; display: flex; align-items: center; justify-content: center">
          <span style="font-size: {{s.fs}}px; line-height: 1; color: {{s.pc}}; text-shadow: {{s.sh}}; font-weight: 700; font-family: 'Segoe UI Symbol', 'Noto Sans Symbols 2', 'DejaVu Sans', serif">{{s.glyph}}</span>
        </div>
      </sc-for>
    </div>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 8px">
      <div style="padding: 10px 12px; border-radius: 12px; background: #17191E; display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; color: #9AA0AB">Accuracy</span><span style="font: 700 16px 'JetBrains Mono', monospace">78%</span></div>
      <div style="padding: 10px 12px; border-radius: 12px; background: #17191E; display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; color: #9AA0AB">Slips</span><span style="font: 700 16px 'JetBrains Mono', monospace; color: #FFB547">3</span></div>
      <div style="padding: 10px 12px; border-radius: 12px; background: #17191E; display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; color: #9AA0AB">Guards</span><span style="font: 700 16px 'JetBrains Mono', monospace">2</span></div>
      <div style="padding: 10px 12px; border-radius: 12px; background: #17191E; display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; color: #9AA0AB">Peeks</span><span style="font: 700 16px 'JetBrains Mono', monospace">0</span></div>
    </div>
  </div>

  <div style="padding: 20px 20px 8px; font-size: 17px; font-weight: 600">Where the picture slipped</div>
  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{slips}}" as="x" hint-placeholder-count="3">
      <div style="padding: 12px 14px; border-radius: 14px; background: #17191E; border: 1px solid #2A2E37; display: flex; gap: 12px; align-items: flex-start">
        <span style="min-width: 36px; padding: 3px 0; border-radius: 6px; background: #2A2E37; text-align: center; font: 700 12px 'JetBrains Mono', monospace; color: #FFB547">{{x.move}}</span>
        <div style="display: flex; flex-direction: column; gap: 3px">
          <span style="font: 700 14px 'JetBrains Mono', monospace">{{x.tried}}</span>
          <span style="font-size: 13px; color: #9AA0AB; line-height: 1.4">{{x.why}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding: 0 16px 22px; display: flex; flex-direction: column; gap: 8px">
    <div style="padding: 12px 14px; border-radius: 14px; background: #1A2010; border: 1px solid #4B5E17; font-size: 14px; display: flex; justify-content: space-between; align-items: center">
      <span>Unlocked: <span style="font-weight: 700">Voice-only rated games</span></span>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C6F432" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 52px; border-radius: 14px; border: 1px solid #2A2E37; background: #17191E; color: #ECEDEF; font: 600 15px 'Space Grotesk', sans-serif">Drill my slips</button>
      <a href="Voice.dc.html" style="height: 52px; border-radius: 14px; background: #C6F432; color: #0E0F12; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">Play again</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  buildBoard(o) {
    var G = { K: '♚', Q: '♛', R: '♜', B: '♝', N: '♞', P: '♟' };
    var F = 'abcdefgh'; var pos = {}; var rows = o.fen.split('/');
    for (var r = 0; r < 8; r++) { var c = 0; var row = rows[r]; for (var k = 0; k < row.length; k++) { var ch = row[k]; if (ch >= '1' && ch <= '8') { c += parseInt(ch, 10); } else { pos[F[c] + (8 - r)] = ch; c++; } } }
    var sz = o.size || 43; var out = [];
    for (var i = 0; i < 8; i++) { for (var j = 0; j < 8; j++) {
      var f = j; var rk = 8 - i; var sq = F[f] + rk; var light = (f + rk) % 2 === 1;
      var p = pos[sq];
      var bg = light ? '#8E97A8' : '#59627A';
      var glyph = ''; var pc = '#FBFAF6'; var sh = 'none';
      if (p) { var w = p === p.toUpperCase(); glyph = G[p.toUpperCase()] + '︎'; pc = w ? '#FBFAF6' : '#121318'; sh = w ? '0 0 1px #121318, 0 1px 2px rgba(0,0,0,0.6)' : '0 0 1px rgba(255,255,255,0.5)'; }
      out.push({ k: sq, bg: bg, glyph: glyph, pc: pc, sh: sh, sz: sz, fs: Math.round(sz * 0.8) });
    } }
    return out;
  }
  renderVals() {
    var slips = [
      { move: '14', tried: 'Bb5 (illegal)', why: 'Your bishop left c4 on move 11 — it was on e2.' },
      { move: '22', tried: 'Rxd6', why: 'Missed the queen on f6 defending. Guard caught it.' },
      { move: '31', tried: '"where’s my knight?"', why: 'Lost track after the trade on d5. Drilling d5 squares.' }
    ];
    return { sq: this.buildBoard({ fen: '6k1/pp3pp1/3p3p/8/4P3/3P2KP/5PP1/8', size: 22 }), slips: slips };
  }
}
</script>
</body>
</html>
